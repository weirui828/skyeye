name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact commit to test and package for a release
        type: string
        required: true
      artifact_name:
        type: string
        required: true
    outputs:
      version:
        description: Version embedded in the packaged app
        value: ${{ jobs.package.outputs.version }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.artifact_name || 'preview' }}
  cancel-in-progress: ${{ inputs.checkout_ref == '' && github.event_name != 'workflow_dispatch' }}

jobs:
  test:
    name: Test (macos-15)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - name: Verify app and release versions match
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import plistlib

          version = Path("version.txt").read_text().strip()
          manifest = json.loads(Path(".release-please-manifest.json").read_text())["."]
          with open("Resources/Info.plist", "rb") as file:
              app = plistlib.load(file)["CFBundleShortVersionString"]
          if not version == manifest == app:
              raise SystemExit(f"Version mismatch: version.txt={version}, manifest={manifest}, app={app}")
          PY
      - name: Swift version
        run: swift --version
      - name: Set up Python for HTTP test services
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Shell syntax
        run: |
          for script in scripts/build.sh scripts/install.sh scripts/package.sh; do
            bash -n "$script"
          done
      - name: Installer safety tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Core tests
        env:
          SKYEYE_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: swift test --disable-sandbox
      - name: Build and verify app
        run: ./scripts/build.sh

  package:
    name: Package Apple Silicon app
    outputs:
      version: ${{ steps.version.outputs.version }}
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - name: Build disk image and ZIP
        run: ./scripts/package.sh
      - name: Read packaged app version
        id: version
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/SkyEye.app/Contents/Info.plist)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Upload developer preview packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact_name || 'SkyEye-arm64-developer-preview' }}
          path: |
            build/SkyEye-*.dmg
            build/SkyEye-*.zip
            build/SkyEye-*-SHA256SUMS.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 14
