name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      test_filter:
        description: Optional Swift test filter for diagnosis; leave empty for full validation
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Swift version
        run: swift --version
      - name: Set up Python for HTTP test services
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Shell syntax
        run: |
          for script in scripts/build.sh scripts/install.sh scripts/package.sh; do
            bash -n "$script"
          done
      - name: Installer safety tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Core tests
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
          SKYEYE_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          if [[ -n "$TEST_FILTER" ]]; then
            swift test --disable-sandbox --filter "$TEST_FILTER"
          else
            swift test --disable-sandbox
          fi
      - name: Build and verify app
        run: ./scripts/build.sh

  package:
    name: Package Apple Silicon app
    needs: test
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.test_filter == '')
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build disk image and ZIP
        run: ./scripts/package.sh
      - name: Upload developer preview packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SkyEye-arm64-developer-preview
          path: |
            build/SkyEye-*.dmg
            build/SkyEye-*.zip
            build/SkyEye-*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
