name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a release after tests and packaging (main only; version from Info.plist)
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  test:
    name: Test (macos-15)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate release branch
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must run from main." >&2
            exit 1
          fi
      - name: Swift version
        run: swift --version
      - name: Set up Python for HTTP test services
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Shell syntax
        run: |
          for script in scripts/build.sh scripts/install.sh scripts/package.sh; do
            bash -n "$script"
          done
      - name: Installer safety tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Core tests
        env:
          SKYEYE_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: swift test --disable-sandbox
      - name: Build and verify app
        run: ./scripts/build.sh

  package:
    name: Package Apple Silicon app
    outputs:
      version: ${{ steps.version.outputs.version }}
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read app version
        id: version
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a numeric major.minor.patch app version." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build disk image and ZIP
        run: ./scripts/package.sh
      - name: Upload developer preview packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SkyEye-arm64-developer-preview
          path: |
            build/SkyEye-*.dmg
            build/SkyEye-*.zip
            build/SkyEye-*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.package.outputs.version }}
    steps:
      - name: Require a new release version
        run: |
          COUNT="$(gh api "repos/$GH_REPO/git/matching-refs/tags/v$RELEASE_VERSION" \
            --jq "map(select(.ref == \"refs/tags/v$RELEASE_VERSION\")) | length")"
          if [[ "$COUNT" != "0" ]]; then
            echo "Tag v$RELEASE_VERSION already exists. Update the app version before releasing." >&2
            exit 1
          fi
      - name: Download tested packages
        run: gh run download "$GITHUB_RUN_ID" --name SkyEye-arm64-developer-preview --dir build
      - name: Verify checksums
        working-directory: build
        run: sha256sum -c "SkyEye-$RELEASE_VERSION-arm64-SHA256SUMS.txt"
      - name: Publish developer preview
        run: |
          gh release create "v$RELEASE_VERSION" \
            "build/SkyEye-$RELEASE_VERSION-arm64.dmg" \
            "build/SkyEye-$RELEASE_VERSION-arm64.zip" \
            "build/SkyEye-$RELEASE_VERSION-arm64-SHA256SUMS.txt" \
            --target "$GITHUB_SHA" \
            --title "SkyEye v$RELEASE_VERSION — Developer Preview" \
            --generate-notes \
            --notes "Requires macOS 14 or later and an Apple Silicon Mac (M1 or later). Download the DMG and drag SkyEye.app into Applications. Intel Macs are not supported." \
            --prerelease
