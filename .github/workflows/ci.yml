name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Swift version
        run: swift --version
      - name: Shell syntax
        run: |
          for script in scripts/build.sh scripts/install.sh scripts/package.sh; do
            bash -n "$script"
          done
      - name: Installer safety tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Core tests
        run: swift test --disable-sandbox
      - name: Build and verify app
        run: ./scripts/build.sh

  package:
    name: Package universal app
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build disk image and ZIP
        run: ./scripts/package.sh
      - name: Upload developer preview packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SkyEye-universal-developer-preview
          path: |
            build/SkyEye-*.dmg
            build/SkyEye-*.zip
            build/SkyEye-*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
